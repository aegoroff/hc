name: CI

env:
  Revision: ${{ github.run_number }}
  GITHUB_REF: "${{ github.ref }}"
  # Optional: override makensis location. windows_build.ps1 also finds scoop/PATH.
  # NSIS_ROOT: "C:/Program Files (x86)/NSIS"
  RELEASE_DIR: artifacts
  RELEASE_BIN: hc
  PROJECT_NAME: hc
  RELEASER_VER: 0.16.0
  CI_BUILD_NUMBER: ${{ github.run_number }}

on:
  push:
    tags:
      - "v*" # Run when tag matches v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ master, develop ]

  workflow_dispatch:

jobs:
  prepare:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          # Tag releases: refs/tags/v6.0.0 -> 6.0.0
          # PR / branch refs are not semver and may contain '/' (e.g.
          # refs/pull/249/merge -> "49/merge"), which breaks TGZ paths.
          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/tags/v* ]]; then
            version="${ref#refs/tags/v}"
          elif [[ "$ref" == refs/pull/*/merge ]] || [[ "$ref" == refs/pull/*/head ]]; then
            pr="${ref#refs/pull/}"
            pr="${pr%%/*}"
            version="6.0.0-pr.${pr}.${CI_BUILD_NUMBER}"
          else
            branch="${ref#refs/heads/}"
            branch="$(echo "$branch" | sed 's/[^A-Za-z0-9._-]/-/g')"
            version="6.0.0-${branch}.${CI_BUILD_NUMBER}"
          fi
          version="$(echo "$version" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          echo "using version ${version} (from ${ref})"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

  windows_build:
    # Zig-based Windows build, mirroring linux_build.sh: zig build for the
    # x86_64-windows-msvc target + zig unit tests + pytest black-box.
    # CUDA is required (hard fail without nvcc) for GPU parity with Linux gnu;
    # scripts/build_external_libs.ps1 provisions OpenSSL (libcrypto) on first run.
    name: Windows Build
    needs: [ prepare ]
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: read
      checks: write
    # Self-hosted Windows runner has Windows PowerShell 5.1, not pwsh
    # (GitHub's Windows default). Force powershell for all run: steps.
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v6
      # Prefer a preinstalled Zig on the self-hosted runner (seconds vs minutes).
      # setup-zig is the fallback; use-cache=false avoids a multi-minute
      # .zig-cache round-trip to GitHub Cache (local zig-out/.zig-cache persists).
      - name: Resolve Zig
        id: zig
        run: |
          $required = "0.16.0"
          $cmd = Get-Command zig -ErrorAction SilentlyContinue
          if ($cmd) {
            $ver = (& zig version).Trim()
            if ($ver -eq $required) {
              Write-Output "Using preinstalled zig $ver at $($cmd.Source)"
              "need_setup=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            Write-Output "Preinstalled zig $ver != $required; falling back to setup-zig"
          } else {
            Write-Output "zig not on PATH; falling back to setup-zig"
          }
          "need_setup=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install Zig
        if: steps.zig.outputs.need_setup == 'true'
        uses: weldengine/setup-zig@54499ecef77a0c766167134a6f868afadba9e042 # v0.1.0 (node24)
        with:
          version: 0.16.0
          use-cache: false
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '17.14'
        # MSVC toolchain for CUDA .cu host compilation (nvcc on Windows).
        # zig itself auto-detects the windows-msvc toolchain for the native build.
      # nvcc's Windows host path needs cl.exe on PATH; setup-msbuild alone is not
      # enough. msvc-dev-cmd exports the full VS developer environment for CUDA.
      - uses: step-security/msvc-dev-cmd@v1
      - name: Build (zig)
        run: ./windows_build.ps1
        env:
          HC_VERSION: ${{ needs.prepare.outputs.version }}
          PROJECT_BASE_PATH: ${{ github.workspace }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: test-results/
          if-no-files-found: ignore
      - name: Publish pytest results
        if: ${{ !cancelled() && hashFiles('test-results/**/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: pytest Tests (Windows)
          path: test-results/**/*.xml
          path-replace-backslashes: 'true'
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
          report-title: pytest black-box (_tst.py)

      - name: Create artifact directories
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.RELEASE_DIR }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.RELEASE_DIR }}-core2 | Out-Null
      - name: Packaging
        if: endsWith(github.ref, 'merge') == false
        run: |
          # Haswell TGZ + NSIS only (one .gz). Releaser scoop takes the first .gz;
          # keep core2 in a separate artifact so scoop gets the haswell binary.
          Get-ChildItem -Path ./bin/*.gz | Where-Object { $_.Name -notlike '*-core2.tar.gz' } |
            Copy-Item -Destination ./${{ env.RELEASE_DIR }}/ -Verbose
          Copy-Item -Path ./src/Install/Release/*.exe -Destination ./${{ env.RELEASE_DIR }}/ -Verbose
          Get-ChildItem -Path ./bin/*-core2.tar.gz -ErrorAction SilentlyContinue |
            Copy-Item -Destination ./${{ env.RELEASE_DIR }}-core2/ -Verbose
      - uses: actions/upload-artifact@v7
        if: endsWith(github.ref, 'merge') == false
        with:
          name: windows
          path: ./${{ env.RELEASE_DIR }}
      - uses: actions/upload-artifact@v7
        if: endsWith(github.ref, 'merge') == false
        with:
          name: windows-core2
          path: ./${{ env.RELEASE_DIR }}-core2
          if-no-files-found: ignore

  linux_build:
    name: Linux Build
    needs: [ prepare ]
    # x86_64 (+ macOS cross) on the x64 runner; native aarch64 Linux on ARM64.
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            abi: gnu
            os: linux
            arch: x86_64
            runs_on: [self-hosted, linux, x64]
          - target: x86_64-linux-musl
            abi: musl
            os: linux
            arch: x86_64
            runs_on: [self-hosted, linux, x64]
          - target: aarch64-linux-musl
            abi: musl
            os: linux
            arch: aarch64
            runs_on: [self-hosted, linux, ARM64]
          - target: aarch64-macos-none
            abi: none
            os: macos
            arch: aarch64
            runs_on: [self-hosted, linux, x64]
          - target: x86_64-macos-none
            abi: none
            os: macos
            arch: x86_64
            runs_on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v7
      # Prefer a preinstalled Zig on the self-hosted runner (seconds vs minutes).
      # setup-zig is the fallback; use-cache=false avoids a multi-minute
      # .zig-cache round-trip to GitHub Cache (local zig-out/.zig-cache persists).
      - name: Resolve Zig
        id: zig
        run: |
          required="0.16.0"
          if command -v zig >/dev/null 2>&1; then
            ver="$(zig version | tr -d '[:space:]')"
            if [ "$ver" = "$required" ]; then
              echo "Using preinstalled zig $ver at $(command -v zig)"
              echo "need_setup=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Preinstalled zig $ver != $required; falling back to setup-zig"
          else
            echo "zig not on PATH; falling back to setup-zig"
          fi
          echo "need_setup=true" >> "$GITHUB_OUTPUT"
      - name: Install Zig
        if: steps.zig.outputs.need_setup == 'true'
        uses: weldengine/setup-zig@54499ecef77a0c766167134a6f868afadba9e042 # v0.1.0 (node24)
        with:
          version: 0.16.0
          use-cache: false
      # Self-hosted Linux runner needs python3 on PATH for the gnu pytest
      # black-box (linux_build.sh creates .venv-tst).
      - name: Build (zig)
        run: |
          chmod +x ./linux_build.sh ./scripts/build_external_libs.sh
          ./linux_build.sh ${{ matrix.abi }} ${{ matrix.os }} ${{ matrix.arch }}
        env:
          HC_VERSION: ${{ needs.prepare.outputs.version }}
          PROJECT_BASE_PATH: "${{runner.workspace}}/${{ env.PROJECT_NAME }}"

      - name: Upload test results
        if: ${{ !cancelled() && matrix.os == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.abi }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - name: Publish pytest results
        # gnu on x64; musl on ARM64 (only Linux aarch64 matrix leg).
        if: ${{ !cancelled() && matrix.os == 'linux' && ((matrix.abi == 'gnu' && matrix.arch == 'x86_64') || matrix.arch == 'aarch64') && hashFiles('test-results/**/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: pytest Tests (Linux ${{ matrix.abi }} ${{ matrix.arch }})
          path: test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
          report-title: pytest black-box (_tst.py)

      - name: Create artifact directory
        run: mkdir -p ${{ env.RELEASE_DIR }}
      - name: Packaging
        if: endsWith(github.ref, 'merge') == false
        run: cp -v ./bin/*.gz ./${{ env.RELEASE_DIR }}/
      - uses: actions/upload-artifact@v7
        if: endsWith(github.ref, 'merge') == false
        with:
          name: ${{ matrix.os }}_${{ matrix.abi }}_${{ matrix.arch }}
          path: ./${{ env.RELEASE_DIR }}

  generate-changelog:
    name: Generate changelog
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve git-cliff args
        id: cliff
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          version="$(echo "$version" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          # Full release (exact MAJOR.MINOR.PATCH): fold every prerelease tag
          # into this release's notes. Prereleases keep adjacent-tag ranges.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args='-vv --latest --strip header --ignore-tags ^v?[0-9]+\.[0-9]+\.[0-9]+.+'
            echo "changelog: full release ${version} (ignore prerelease tags)"
          else
            args='-vv --latest --strip header'
            echo "changelog: prerelease ${version} (no tag ignore)"
          fi
          {
            echo 'args<<EOF'
            echo "${args}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Generate a changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff
        with:
          config: cliff.toml
          args: ${{ steps.cliff.outputs.args }}
        env:
          OUTPUT: CHANGES.md

  release:
    name: GitHub Release
    needs: [ windows_build, linux_build, generate-changelog ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          version="$(echo "$version" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          # Arch pkgver cannot contain hyphens. Concatenate prerelease so
          # 6.0.0-beta1 → 6.0.0beta1 (vercmp sorts before final 6.0.0).
          # Underscores would sort newer than the final release — wrong.
          aur_version="${version//-/}"
          # Full release only for exact MAJOR.MINOR.PATCH (v6.0.0, v6.1.0).
          # Anything else (v6.0.0-beta1, v6.0.0beta1, v6.0.0.beta1, …)
          # is a GitHub prerelease.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "using version ${version} (AUR pkgver ${aur_version}, prerelease=${prerelease})"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "AUR_VERSION=${aur_version}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Download artefacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Create fake Cargo.toml
        run: |
          cat >Cargo.toml <<EOL
          [package]
          name = "${{ env.RELEASE_BIN }}"
          version = "${{ steps.get_version.outputs.VERSION }}"
          description = "Hash Calculator is the console tool that can calculate about 50 cryptographic hashes of strings and files."
          authors = ["egoroff <egoroff@gmail.com>"]
          homepage = "https://github.com/aegoroff/hc"
          license = "LGPL-3.0"
          EOL

      - name: Download Releaser
        run: |
          curl -L  -o releaser.tar.gz https://github.com/aegoroff/releaser/releases/download/${{ env.RELEASER_VER }}/releaser-${{ env.RELEASER_VER }}-x86_64-unknown-linux-musl.tar.gz
          tar -xf releaser.tar.gz

      - name: Create scoop json
        run: ${{ github.workspace }}/releaser s -c . -b https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/ -i './release/windows/' -e ${{ env.RELEASE_BIN }}.exe -u ${{ env.RELEASE_BIN }}.json
      - name: Publish scoop json
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_TOKEN }}
        with:
          source_file: ${{ env.RELEASE_BIN }}.json
          destination_repo: 'aegoroff/scoop-bucket'
          user_email: 'egoroff@email.com'
          user_name: 'aegoroff'
          commit_message: "release: ${{ steps.get_version.outputs.VERSION }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: "${{ needs.generate-changelog.outputs.release_body }}"
          prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
          files: |
            ./release/**/*.{tar.gz,exe}

      - name: Publish hash-calculator-bin
        if: steps.get_version.outputs.PRERELEASE == 'false'
        uses: zokugun/github-actions-aur-releaser@v1
        with:
          package_name: hash-calculator-bin
          aur_private_key: ${{ secrets.AUR_PRIVATE_KEY }}
          aur_username: ${{ secrets.AUR_USERNAME }}
          aur_email: ${{ secrets.AUR_EMAIL }}
          package_version: ${{ steps.get_version.outputs.AUR_VERSION }}