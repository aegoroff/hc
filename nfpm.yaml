# Binary .deb / .rpm (gnu) and .apk (musl) from release artefacts (hc + l2h).
# Env expanded by nfpm: VERSION, ARCH
#   deb: amd64|arm64; rpm: x86_64|aarch64
#   apk: x86_64|aarch64 (Alpine)
# Staging dir is prepared by scripts/package_linux.sh relative to the repo root.
name: hash-calculator
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Alexander Egorov <egoroff@gmail.com>
description: |-
  Hash Calculator is the console tool that can calculate about 60 cryptographic hashes of strings and files.
homepage: https://github.com/aegoroff/hc
license: LGPL-3.0
contents:
  - src: ./pkg-staging/hc
    dst: /usr/bin/hc
    file_info:
      mode: 0755
  - src: ./pkg-staging/l2h
    dst: /usr/bin/l2h
    file_info:
      mode: 0755
  - src: ./pkg-staging/LICENSE.txt
    dst: /usr/share/doc/hash-calculator/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ./pkg-staging/LICENSE.txt
    dst: /usr/share/licenses/hash-calculator/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  - src: ./pkg-staging/LICENSE.txt
    dst: /usr/share/licenses/hash-calculator/LICENSE
    packager: apk
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      # Matches the gnu target's pinned glibc floor in build.zig.
      - libc6 (>= 2.17)
  rpm:
    depends:
      - glibc >= 2.17
  apk:
    depends: []
